name: Frontend Health Check

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - 'config/docker/docker-compose.yml'
      - '.github/workflows/frontend-health-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'config/docker/docker-compose.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: false
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

env:
  NODE_VERSION: '18'
  FRONTEND_PORT: 3002

jobs:
  health-check:
    name: Frontend Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Create environment file
      working-directory: frontend
      run: |
        cp .env.example .env
        echo "REACT_APP_SUPABASE_URL=http://localhost:8000" >> .env
        echo "REACT_APP_SUPABASE_ANON_KEY=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQxNzY5MjAwLCJleHAiOjE5NTczNDEyMDB9.dc_X5iR_VP_qT0zsityj_I_OZ2T9FtRU2BBNWN8Bu4GE" >> .env
        echo "REACT_APP_API_URL=http://localhost:3001" >> .env
        echo "REACT_APP_ENVIRONMENT=test" >> .env

    - name: Build application
      working-directory: frontend
      run: |
        npm run build
        ls -la build/

    - name: Start Supabase services
      run: |
        # Start only essential Supabase services for testing
        docker-compose up -d supabase-db supabase-kong supabase-auth supabase-rest redis
        
        # Wait for services to be ready
        echo "Waiting for Supabase services to start..."
        sleep 30
        
        # Check service health
        docker-compose ps

    - name: Start backend service
      run: |
        docker-compose up -d backend
        sleep 10
        docker-compose ps backend

    - name: Start frontend application
      working-directory: frontend
      env:
        PORT: ${{ env.FRONTEND_PORT }}
        CI: true
        FRONTEND_URL: http://localhost:${{ env.FRONTEND_PORT }}
      run: |
        # Start the built frontend using a simple server
        npx serve -s build -l ${{ env.FRONTEND_PORT }} &
        echo $! > frontend.pid
        
        # Wait for frontend to start
        echo "Waiting for frontend to start..."
        timeout 60s bash -c 'until curl -s http://localhost:${{ env.FRONTEND_PORT }} > /dev/null; do sleep 2; echo "Waiting..."; done'
        echo "Frontend started successfully"

    - name: Run unit tests
      working-directory: frontend
      run: |
        npm run test:health -- --watchAll=false --ci --coverage --testResultsProcessor=jest-junit
      env:
        CI: true

    - name: Run integration tests  
      working-directory: frontend
      run: |
        npm run test:integration -- --watchAll=false --ci
      env:
        CI: true
        REACT_APP_API_URL: http://localhost:3001
        REACT_APP_SUPABASE_URL: http://localhost:8000

    - name: Run standalone health check
      working-directory: frontend
      env:
        FRONTEND_URL: http://localhost:${{ env.FRONTEND_PORT }}
        HEALTH_CHECK_TIMEOUT: 30
        HEALTH_CHECK_RETRIES: 5
      run: |
        node src/scripts/healthCheck.js

    - name: Run Docker health check
      env:
        FRONTEND_URL: http://localhost:${{ env.FRONTEND_PORT }}
        DOCKER_CONTAINER_NAME: gep-partner-system-frontend-1
      run: |
        cd frontend && bash src/scripts/docker-health.sh

    - name: Run E2E tests
      working-directory: frontend
      env:
        FRONTEND_URL: http://localhost:${{ env.FRONTEND_PORT }}
      run: |
        npm run test:e2e -- --reporter=html,junit
      continue-on-error: true

    - name: Run comprehensive CI health check
      working-directory: frontend
      env:
        CI_FRONTEND_URL: http://localhost:${{ env.FRONTEND_PORT }}
        CI_TIMEOUT: 60
        CI_RETRIES: 5
        CI_OUTPUT_FORMAT: json
        CI_VERBOSE: true
      run: |
        bash src/scripts/ci-health-check.sh

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          frontend/test-results/
          frontend/coverage/
          frontend/health-check-results.json
          frontend/junit.xml
        retention-days: 30

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let comment = '## Frontend Health Check Results\n\n';
          
          try {
            const results = JSON.parse(fs.readFileSync('frontend/health-check-results.json', 'utf8'));
            comment += `✅ Health check completed successfully!\n\n`;
            comment += `Frontend application is healthy and ready for deployment.\n`;
          } catch (error) {
            comment += `❌ Health check failed or results not available.\n\n`;
            comment += `Please check the workflow logs for details.\n`;
          }
          
          comment += `\n📊 [View detailed results](${context.payload.pull_request.html_url}/checks)\n`;
          comment += `🎭 [View Playwright report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Cleanup
      if: always()
      run: |
        # Stop all services
        docker-compose down --volumes --remove-orphans
        
        # Kill frontend process if it's still running
        if [ -f frontend/frontend.pid ]; then
          kill $(cat frontend/frontend.pid) 2>/dev/null || true
          rm frontend/frontend.pid
        fi
        
        # Clean up
        docker system prune -f

  deployment-simulation:
    name: Deployment Simulation
    runs-on: ubuntu-latest
    needs: health-check
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Simulate production deployment
      run: |
        echo "🚀 Simulating production deployment..."
        
        # Build production Docker image
        docker build -t gep-frontend:latest ./frontend --target production
        
        # Run production container
        docker run -d -p 8080:80 --name gep-frontend-prod gep-frontend:latest
        
        # Wait for container to start
        sleep 10
        
        # Test production deployment
        curl -f http://localhost:8080 || exit 1
        
        echo "✅ Production deployment simulation successful!"
        
        # Cleanup
        docker stop gep-frontend-prod
        docker rm gep-frontend-prod

    - name: Report deployment status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Deployment simulation passed - ready for production"
        else
          echo "❌ Deployment simulation failed - do not deploy"
          exit 1
        fi