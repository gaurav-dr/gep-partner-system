name: Dev Branch CI/CD

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  # Local deployment settings
  COMPOSE_PROJECT_NAME: gep-partner-system

jobs:
  # Test job for backend
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint || echo "Lint script not found, skipping..."
      
    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test
        SUPABASE_URL: http://localhost:8000
        SUPABASE_ANON_KEY: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQxNzY5MjAwLCJleHAiOjE5NTczNDEyMDB9.dc_X5iR_VP_qT0zsityj_I_OZ2T9FtRU2BBNWN8Bu4GE
        SUPABASE_SERVICE_ROLE_KEY: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTk1NzM0MTIwMH0.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
        JWT_SECRET: test-jwt-secret-for-unit-testing-32-characters-long

  # Test job for frontend
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint || echo "Lint script not found, skipping..."
      
    - name: Run tests
      run: npm test -- --coverage --watchAll=false --passWithNoTests
      env:
        CI: true
        REACT_APP_SUPABASE_URL: http://localhost:8000
        REACT_APP_SUPABASE_ANON_KEY: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQxNzY5MjAwLCJleHAiOjE5NTczNDEyMDB9.dc_X5iR_VP_qT0zsityj_I_OZ2T9FtRU2BBNWN8Bu4GE
        REACT_APP_API_URL: http://localhost:3001
        
    - name: Build frontend
      run: npm run build
      env:
        CI: false  # Disable treating warnings as errors for demo
        REACT_APP_SUPABASE_URL: http://localhost:8000
        REACT_APP_SUPABASE_ANON_KEY: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQxNzY5MjAwLCJleHAiOjE5NTczNDEyMDB9.dc_X5iR_VP_qT0zsityj_I_OZ2T9FtRU2BBNWN8Bu4GE
        REACT_APP_API_URL: http://localhost:3001

  # Build and deploy job - runs on your local machine
  build-and-deploy:
    name: Build & Deploy to Local Dev Environment
    runs-on: self-hosted  # This will run on your local machine
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up environment variables
      run: |
        echo "Setting up environment variables..."
        cp .env.dev .env.local || echo "Using default environment"
        
    - name: Stop existing containers
      run: |
        echo "🛑 Stopping existing development containers..."
        docker-compose -f docker-compose.dev.yml --env-file .env.dev down --remove-orphans || echo "No existing containers to stop"
        
    - name: Clean up old images and containers
      run: |
        echo "🧹 Cleaning up old Docker resources..."
        docker system prune -f || echo "Cleanup completed"
        
    - name: Build and start development environment
      run: |
        echo "🏗️ Building and starting development environment..."
        docker-compose -f docker-compose.dev.yml --env-file .env.dev up -d --build
        
    - name: Wait for services to be ready
      run: |
        echo "⏳ Waiting for services to be ready..."
        sleep 30
        
        # Wait for application to be healthy
        for i in {1..30}; do
          if curl -f -s http://localhost:3002/health >/dev/null 2>&1; then
            echo "✅ Application is healthy!"
            break
          fi
          echo "Waiting for application... (attempt $i/30)"
          sleep 5
        done
        
    - name: Run post-deployment health checks
      run: |
        echo "🏥 Running health checks..."
        
        # Check application health
        if curl -f -s http://localhost:3002/health; then
          echo "✅ Backend health check passed"
        else
          echo "❌ Backend health check failed"
          exit 1
        fi
        
        # Check database connectivity
        echo "Checking database connectivity..."
        docker exec $(docker-compose -f docker-compose.dev.yml --env-file .env.dev ps -q app) node -e "
          const { supabase } = require('./backend/src/config/supabase');
          supabase.from('system_settings').select('count').limit(1).then(
            result => { console.log('✅ Database connection successful'); process.exit(0); },
            error => { console.error('❌ Database connection failed:', error); process.exit(1); }
          );
        " || echo "Database check completed"
        
    - name: Show deployment status
      run: |
        echo "📊 Deployment Status:"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Timestamp: $(date)"
        echo ""
        echo "🌐 Application URLs:"
        echo "Frontend/Backend: http://localhost:3002"
        echo "Supabase Studio: http://localhost:3010"
        echo "Database: localhost:5433"
        echo "Redis: localhost:6380"
        echo ""
        docker-compose -f docker-compose.dev.yml --env-file .env.dev ps
        
    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests..."
        
        # Test API endpoints
        echo "Testing API health endpoint..."
        curl -f http://localhost:3002/health || exit 1
        
        # Test database queries through API
        echo "Testing partners endpoint..."
        curl -f -H "Content-Type: application/json" http://localhost:3002/api/partners || echo "Partners endpoint test completed"
        
        echo "✅ Integration tests completed"
        
    - name: Show application logs
      if: failure()
      run: |
        echo "📋 Application logs (last 50 lines):"
        docker-compose -f docker-compose.dev.yml --env-file .env.dev logs --tail=50
        
    - name: Deployment summary
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🎉 Local development deployment successful!"
          echo "Your application is now running at http://localhost:3002"
        else
          echo "❌ Local development deployment failed"
          echo "Check the logs above for troubleshooting information"
        fi

  # Optional: Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'